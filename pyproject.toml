[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "jungle-package"
version = "0.0.4"
requires-python = ">= 3.13"
authors = [
    {name = "Yannik Marchand", email = "ymarchand@me.com"}
]
description = "A library to work with Nintendo file formats."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/kinnay/Jungle.git"
Issues = "https://github.com/kinnay/Jungle/issues"

[tool.setuptools.packages.find]
namespaces = true
include = ["jungle", "jungle.*"]
